<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Space Weather Stories experience map</title>
  <desc id="desc">The landing page routes learners to six space-weather stories: aurora, radio operator, electrical engineer, solar flare, farmer and astronaut.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091120"/><stop offset="1" stop-color="#182843"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#77eef8" stop-opacity=".35"/><stop offset="1" stop-color="#77eef8" stop-opacity="0"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7cf4ff"/></marker>
  </defs>
  <rect width="1200" height="640" rx="30" fill="url(#bg)"/>
  <circle cx="600" cy="320" r="300" fill="url(#glow)"/>
  <g fill="#fff" opacity=".75"><circle cx="95" cy="90" r="2"/><circle cx="180" cy="150" r="1.5"/><circle cx="1090" cy="110" r="2"/><circle cx="1010" cy="210" r="1.5"/><circle cx="80" cy="525" r="1.5"/><circle cx="1120" cy="520" r="2"/><circle cx="935" cy="75" r="1"/><circle cx="310" cy="80" r="1"/></g>
  <text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#e9f2ff">Space Weather Stories</text>
  <text x="60" y="108" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#9fb5e6">Six interactive perspectives on how solar activity affects life and technology</text>
  <g filter="url(#s)">
    <rect x="455" y="235" width="290" height="170" rx="28" fill="#102444" stroke="#7cf4ff" stroke-width="3"/>
    <rect x="70" y="175" width="225" height="125" rx="22" fill="#10233e" stroke="#9cff6e" stroke-width="2"/>
    <rect x="70" y="385" width="225" height="125" rx="22" fill="#10233e" stroke="#ff7b7b" stroke-width="2"/>
    <rect x="905" y="175" width="225" height="125" rx="22" fill="#10233e" stroke="#7cf4ff" stroke-width="2"/>
    <rect x="905" y="385" width="225" height="125" rx="22" fill="#10233e" stroke="#b28dff" stroke-width="2"/>
    <rect x="355" y="470" width="225" height="110" rx="22" fill="#10233e" stroke="#ffd166" stroke-width="2"/>
    <rect x="620" y="470" width="225" height="110" rx="22" fill="#10233e" stroke="#9cff6e" stroke-width="2"/>
  </g>
  <text x="600" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#7cf4ff">Landing page</text>
  <text x="600" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d9e7ff">Choose a story or simulation</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9fb5e6">Static HTML • CSS • JavaScript</text>
  <text x="182" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22">🌈 Aurora</text>
  <text x="182" y="258" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#bcd0ed">Atmospheric lights</text>
  <text x="182" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22">📻 Radio</text>
  <text x="182" y="468" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#bcd0ed">HF disruption</text>
  <text x="1017" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22">⚡ Engineer</text>
  <text x="1017" y="258" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#bcd0ed">Power-grid protection</text>
  <text x="1017" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22">🧑‍🚀 Astronaut</text>
  <text x="1017" y="468" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#bcd0ed">Radiation safety</text>
  <text x="467" y="512" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21">☀️ Solar flare</text>
  <text x="467" y="548" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#bcd0ed">Solar eruption</text>
  <text x="732" y="512" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21">🚜 Farmer</text>
  <text x="732" y="548" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#bcd0ed">GPS disruption</text>
  <line x1="455" y1="280" x2="305" y2="238" stroke="#7cf4ff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="455" y1="360" x2="305" y2="430" stroke="#7cf4ff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="745" y1="280" x2="895" y2="238" stroke="#7cf4ff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="745" y1="360" x2="895" y2="430" stroke="#7cf4ff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="545" y1="405" x2="495" y2="460" stroke="#7cf4ff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="655" y1="405" x2="705" y2="460" stroke="#7cf4ff" stroke-width="3" marker-end="url(#a)"/>
</svg>
